<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Usage Monitor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon192.png" />
  <meta name="theme-color" content="#141516" />
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      background: #fff;
      color: #222;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #141516; color: #eee; }
      .bar-track { background: #2a2c2e !important; }
      .limit-label { color: #aaa !important; }
      #status { color: #888 !important; }
      .card { background: #1d1f20 !important; }
    }
    h1 {
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 20px;
    }
    h1 img { width: 28px; height: 28px; border-radius: 7px; }
    .card {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .limit-row { margin-bottom: 12px; }
    .limit-row:last-child { margin-bottom: 0; }
    .limit-label {
      font-size: 13px;
      color: #555;
      display: flex;
      justify-content: space-between;
    }
    .bar-track {
      height: 8px;
      background: #e6e6e6;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    #status { font-size: 12px; color: #999; margin-top: 4px; }
    h2 { font-size: 13px; text-transform: uppercase; color: #888; margin: 24px 0 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 4px 6px; }
    th { color: #888; font-weight: normal; }
    tr:nth-child(even) { background: rgba(128, 128, 128, 0.08); }
  </style>
</head>
<body>
  <h1><img src="icons/icon192.png" alt="" />AI Usage Monitor</h1>

  <div class="card">
    <div id="limits"><em style="font-size:13px;color:#999;">Loading…</em></div>
    <div id="status"></div>
  </div>

  <h2>Recent history</h2>
  <table>
    <thead>
      <tr><th>Time</th><th>Session</th><th>Weekly</th></tr>
    </thead>
    <tbody id="history-body"></tbody>
  </table>

  <script src="app.js" type="module"></script>
</body>
</html>
