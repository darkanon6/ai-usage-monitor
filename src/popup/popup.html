<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Claude Usage Monitor</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 12px;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    .limit-row {
      margin-bottom: 8px;
    }
    .limit-label {
      font-size: 12px;
      color: #555;
      display: flex;
      justify-content: space-between;
    }
    .bar-track {
      height: 6px;
      background: #eee;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 3px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
    }
    #status {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Claude Usage</h1>
  <div id="limits"><em style="font-size:12px;color:#999;">Loading…</em></div>
  <div id="status"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
